openapi: 3.0.3
info:
  title: SmartCrawl
  version: 3.0.0
  description: URL in. Clean markdown and structured JSON out.
servers:
  - url: https://smart-crawler.aetherhost.com.ng
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: SQLite is readable
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /metrics:
    get:
      summary: Prometheus metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: text/plain Prometheus exposition
  /v1/stats:
    get:
      summary: JSON metrics snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Counters
  /v1/providers:
    get:
      summary: Optional server-side provider availability (credentials are never exposed)
      responses:
        '200':
          description: Provider configuration flags
  /v1/me:
    get:
      summary: Current API key identity and remaining daily quota
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Key identity and quota state
  /v1/scrape:
    post:
      summary: Enqueue a scrape job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        '400':
          description: Invalid or SSRF-blocked URL
        '401':
          description: API key required
        '429':
          description: Daily quota exceeded
  /v1/map:
    post:
      summary: Discover same-origin URLs (HTML links + sitemap.xml)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
  /v1/crawl:
    post:
      summary: Multi-page scrape
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
  /v1/jobs:
    get:
      summary: List recent jobs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent job summaries
  /v1/jobs/{jobId}:
    get:
      summary: Job status, logs, and extracted payload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job
        '404':
          description: Not found
  /v1/admin/keys:
    get:
      summary: List key prefixes and usage
      security:
        - adminAuth: []
      responses:
        '200':
          description: Keys without secrets
    post:
      summary: Mint a user API key
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                dailyLimit:
                  type: integer
                  default: 50
      responses:
        '201':
          description: Raw key shown once
  /v1/admin/keys/{id}:
    delete:
      summary: Revoke an API key immediately
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Key revoked
        '404':
          description: Key not found
  /v1/report:
    get:
      summary: Operational health digest and error/latency breakdown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OperationalReport JSON
  /v1/admin/report:
    post:
      summary: Generate operational digest and post to Slack webhook
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
      responses:
        '200':
          description: Slack delivery status and OperationalReport JSON
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: User key `sc_live_…`. Required only when SMARTCRAWL_ADMIN_TOKEN is set.
    adminAuth:
      type: http
      scheme: bearer
      description: Value of SMARTCRAWL_ADMIN_TOKEN
  schemas:
    ScrapeRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
        formats:
          type: array
          items:
            type: string
            enum: [markdown, links, metadata, html]
        onlyMainContent:
          type: boolean
          default: true
        js:
          description: auto | true | false
        provider:
          type: string
          enum: [local, auto, firecrawl]
          default: local
          description: Single-page scrape provider. Firecrawl modes require an operator-configured server credential; map and crawl remain local.
        timeoutMs:
          type: integer
        userAgent:
          type: string
    DiscoverRequest:
      allOf:
        - $ref: '#/components/schemas/ScrapeRequest'
        - type: object
          properties:
            limit:
              type: integer
            includePaths:
              type: array
              items:
                type: string
            excludePaths:
              type: array
              items:
                type: string
    JobCreated:
      type: object
      properties:
        jobId:
          type: string
